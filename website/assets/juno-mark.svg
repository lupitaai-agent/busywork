    <path d="M40 18 L40 9 L48 9 L48 25" fill="#FF8A5B" stroke="#1E1B2E" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M10 30 L32 9 L54 30 L54 54 Q54 57 51 57 L13 57 Q10 57 10 54 Z" fill="#FF8A5B" stroke="#1E1B2E" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M6 32 L32 7.5 L58 32" fill="none" stroke="#1E1B2E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="17" y="35" width="13" height="12" rx="2.5" fill="#FFC93C" stroke="#1E1B2E" stroke-width="3"/>
    <path d="M23.5 35.5 L23.5 46.5 M17.5 41 L29.5 41" stroke="#1E1B2E" stroke-width="2"/>
