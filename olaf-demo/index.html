<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.anthropic.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olaf · Busywork</title>
<link rel="icon" href="../../shared/icons/olaf.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/brand.css">
<link rel="stylesheet" href="../../shared/ai.css">
<style>
  .studio-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 24px; }
  .studio-tabs button { font: inherit; font-weight: 800; padding: 9px 16px; border-radius: 999px; border: 2px solid var(--border); background: var(--surface); color: var(--ink); cursor: pointer; }
  .studio-tabs button[aria-selected="true"] { background: var(--app); color: var(--on-app); box-shadow: var(--shadow-sm); }
  .setup { padding: 20px 22px; margin-bottom: 18px; }
  .setup h2 { display: flex; flex-direction: column; gap: 2px; font-size: 1.3rem; margin-bottom: 10px; }
  .setup h2 small { font-size: .85rem; color: var(--ink-3); font-weight: 700; }
  .setup-list { list-style: none; padding: 0; margin: 0 0 6px; display: flex; flex-direction: column; gap: 8px; }
  .setup-list li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 2px solid var(--hair); border-radius: var(--r-sm); flex-wrap: wrap; }
  .setup-list li > div { flex: 1; min-width: 200px; display: flex; flex-direction: column; }
  .setup-list li small { color: var(--ink-2); font-size: .85rem; }
  .setup-list .tick { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border); display: grid; place-items: center; font-weight: 900; flex-shrink: 0; }
  .setup-list li.is-done .tick { background: var(--mint); color: #1E1B2E; }
  .setup-list li.is-done b { color: var(--ink-2); }
  .setup-list li.is-next { border-color: var(--border); background: var(--app-soft); box-shadow: var(--shadow-sm); }
  .setup-list li.is-skipped { opacity: .6; }
  .setup-list li.final .tick { background: var(--sun); color: #1E1B2E; }
  .setup-list li.final.is-done .tick { background: var(--mint); }
  .setup-done { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 16px 20px; margin-bottom: 16px; background: color-mix(in srgb, var(--mint) 22%, var(--surface)); }
  .setup-done .e { font-size: 2rem; }
  .setup-done > div { flex: 1; min-width: 220px; display: flex; flex-direction: column; }
  .setup-done small { color: var(--ink-2); }
  ul.week li { cursor: pointer; }
  .olaf-title-mark { width: 1.1em; height: 1.1em; vertical-align: -0.12em; margin-right: 4px; }
  .demo-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 16px; margin: 4px 0 16px; border: 2px dashed var(--border); border-radius: var(--r-sm); background: color-mix(in srgb, var(--sun) 25%, var(--surface)); }
  .demo-bar > span { flex: 1; min-width: 220px; }
  .licence { max-width: 560px; margin: 40px auto; padding: 26px 28px; display: flex; flex-direction: column; gap: 12px; }
  .licence textarea { font-family: var(--mono); font-size: .85rem; word-break: break-all; }
  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .pcard { padding: 18px 20px; }
  .pcard h3 { margin-bottom: 8px; }
  .pcard p, .pcard li { color: var(--ink-2); }
  .next { display: flex; flex-direction: column; gap: 10px; }
  .next button { display: flex; gap: 12px; align-items: center; text-align: left; font: inherit; color: inherit; padding: 12px 14px; border: 2px solid var(--border); border-radius: var(--r-sm); background: var(--app-soft); cursor: pointer; box-shadow: var(--shadow-sm); }
  .next .e { font-size: 1.5rem; }
  .next small { display: block; color: var(--ink-2); }
  .coach-hero { display: flex; gap: 18px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 22px 24px; margin-bottom: 16px; background: color-mix(in srgb, var(--app) 18%, var(--surface)); }
  .coach-hero h2 { font-size: 1.35rem; }
  .coach-hero p { color: var(--ink-2); max-width: 620px; margin-top: 4px; }
  /* Six steps: one row on wide screens, 3 × 2 on tablets, 2 × 3 on phones. */
  .stages { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
  @media (max-width: 1100px) { .stages { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .stages { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .stage { border: 2px solid var(--hair); border-radius: var(--r-sm); padding: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; min-height: 104px; }
  .stage .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: .85rem; background: var(--hair); }
  .stage b { line-height: 1.3; font-size: 1rem; overflow-wrap: anywhere; hyphens: auto; }
  .stage small { color: var(--ink-2); font-size: .85rem; }
  .stage.done .n { background: var(--mint); color: #1E1B2E; }
  .stage.now { border-color: var(--border); background: var(--app-soft); box-shadow: var(--shadow-sm); }
  .stage.now .n { background: var(--app); color: var(--on-app); }
  ul.week { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 8px 24px; }
  @media (max-width: 560px) { ul.week { grid-template-columns: 1fr; } }
  ul.week li { padding-left: 26px; position: relative; }
  ul.week li::before { content: ""; position: absolute; left: 0; top: 3px; width: 16px; height: 16px; border-radius: 5px; border: 2px solid var(--border); }
  ul.week li.done { text-decoration: line-through; color: var(--ink-3); }
  ul.week li.done::before { background: var(--mint); }
  .skill-groups h2 { margin: 26px 0 12px; }
  .skill-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .skill { text-align: left; font: inherit; color: inherit; cursor: pointer; padding: 14px 16px; }
  .skill:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--shadow-c); }
  .skill b { display: block; }
  .skill small { color: var(--ink-2); display: block; line-height: 1.35; margin-top: 4px; }
  .files { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; align-items: start; padding-bottom: 40px; }
  @media (max-width: 860px) { .files { grid-template-columns: 1fr; } }
  .files h3 { margin: 14px 0 6px; font-size: 1rem; }
  .files h3:first-child { margin-top: 0; }
  .flist { display: flex; flex-direction: column; gap: 2px; }
  .flist button { font: inherit; text-align: left; padding: 5px 8px; border-radius: 8px; border: 0; background: none; color: inherit; cursor: pointer; overflow-wrap: anywhere; }
  .flist button:hover, .flist button[aria-pressed="true"] { background: var(--app-soft); }
  .fview { min-height: 320px; }
  .side-info [data-open] { white-space: normal; overflow-wrap: anywhere; height: auto; padding: 6px 8px; }
  textarea.mono { font-family: var(--mono); font-size: .85rem; width: 100%; }
  .bubble .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .bubble .tools:empty { display: none; }
  .bubble .notes { margin: -2px 0 10px; font-size: .85rem; color: var(--ink-3); border-left: 3px solid var(--hair); padding-left: 10px; }
  .bubble .notes p { margin: 2px 0; }
  .bubble .tools span { font-size: .78rem; font-weight: 700; padding: 2px 9px; border-radius: 99px; background: var(--surface-2); border: 1.5px solid var(--hair); color: var(--ink-2); }
</style>
</head>
<body class="app-grape" data-root="../../">
<main class="wrap" id="main"></main>
<noscript><p class="wrap">Olaf needs JavaScript switched on.</p></noscript>
<script src="../../shared/core.js"></script>
<script src="library.js"></script>
<script src="olaf-installed.js"></script>
<script src="../../shared/ai.js"></script>
<script src="../marketing/profile.js"></script>
<script src="../../shared/mkt-dash.js"></script>
<script src="../../shared/mkt-insights.js"></script>
<script src="../../shared/qr.js"></script>
<script src="../../shared/mkt-content.js"></script>
<script src="workspace.js"></script>
<script src="agent.js"></script>
<script src="app.js"></script>
</body>
</html>
