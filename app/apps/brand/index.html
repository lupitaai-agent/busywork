<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.anthropic.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand Kit · Busy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🎨</text></svg>">
<link rel="stylesheet" href="../../shared/brand.css">
<style>
  .kit { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; padding-bottom: 40px; }
  @media (max-width: 900px) { .kit { grid-template-columns: 1fr; } }
  .kit > .card { padding: 22px; }
  .kit h2 { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; }
  .kit .sub { color: var(--ink-2); margin-bottom: 16px; }
  .wide { grid-column: 1 / -1; }
  .brand-hero { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
  .brand-hero .stack { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .brand-hero .stack > * + * { margin-top: 0; }
  .logo-box { width: 180px; height: 110px; border: 2px solid var(--border); border-radius: 16px; background: #fff; display: grid; place-items: center; padding: 12px; color: #1E1B2E; font-weight: 900; text-align: center; }
  .logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .tints { display: flex; gap: 0; border: 2px solid var(--border); border-radius: 16px; overflow: hidden; margin-top: 16px; }
  .tints button { flex: 1; height: 86px; border: 0; cursor: pointer; font: inherit; font-size: .75rem; font-weight: 800; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; transition: flex .3s cubic-bezier(.3, 1.4, .5, 1); }
  .tints button:hover { flex: 1.8; }
  .sig-preview { background: #fff; color: #1E1B2E; border: 2px solid var(--border); border-radius: 14px; padding: 22px; overflow-x: auto; margin: 14px 0; color-scheme: light; }
  .steps-mini { font-size: .88rem; color: var(--ink-2); margin-top: 12px; }
  .steps-mini b { color: var(--ink); }
  .cards-pair { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; margin: 10px 0 18px; perspective: 900px; }
  .bcard { width: 255px; height: 165px; border-radius: 10px; background: #fff; color: #1E1B2E; border: 2px solid var(--border); box-shadow: var(--shadow); position: relative; overflow: hidden; padding: 18px; transition: transform .5s cubic-bezier(.3, 1.4, .5, 1); color-scheme: light; }
  .bcard:hover { transform: rotateY(-12deg) rotateX(6deg) translateY(-4px); }
  .bcard.front { display: grid; place-items: center; }
  .bcard.front::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: var(--brand); }
  .bcard.front img { max-width: 70%; max-height: 70px; }
  .bcard.front .nm { font-size: 1.3rem; font-weight: 900; text-align: center; }
  .bcard.back { font-size: .74rem; line-height: 1.55; border-left: 10px solid var(--brand); }
  .bcard.back b { font-size: .95rem; display: block; }
  .bcard.back .role { color: #6B6880; margin-bottom: 8px; display: block; }
  .card-qr { position: absolute; right: 12px; bottom: 12px; }
  .card-qr svg { width: 58px; height: 58px; display: block; }
</style>
</head>
<body class="app-pink" data-root="../../">
<main class="wrap" id="main"></main>
<noscript><p class="wrap">This tool needs JavaScript switched on.</p></noscript>
<script src="../../shared/core.js"></script>
<script src="../../shared/pdf.js"></script>
<script src="../../shared/qr.js"></script>
<script src="app.js"></script>
</body>
</html>
