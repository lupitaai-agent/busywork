# Checks everything (check.py), builds the site with build.py and publishes website/ to GitHub Pages.
# Nothing is published when a check fails.
# One-time setup on GitHub: Settings → Pages → Source: "GitHub Actions".
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: each page's last-changed date comes from git
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check (tests, leak check, a trial build)
        run: python3 check.py
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: python3 build.py
        env:
          # A custom domain set in the Pages settings shows up here too.
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Optional, set under Settings → Secrets and variables → Actions → Variables.
          WAITLIST_ENDPOINT: ${{ vars.WAITLIST_ENDPOINT }}
          WAITLIST_PROVIDER: ${{ vars.WAITLIST_PROVIDER }}
          GROWTH_WAITLIST_ENDPOINT: ${{ vars.GROWTH_WAITLIST_ENDPOINT }}
          OLAF_CHECKOUT_URL: ${{ vars.OLAF_CHECKOUT_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
