    <g transform="translate(3 3)" fill="#1E1B2E">
      <circle cx="20" cy="32" r="13"/>
      <path d="M30 28 L56 28 L56 36 L52 36 L52 43 L45 43 L45 36 L41 36 L41 41 L35 41 L35 36 L30 36 Z"/>
    </g>
    <path d="M30 28 L56 28 L56 36 L52 36 L52 43 L45 43 L45 36 L41 36 L41 41 L35 41 L35 36 L30 36 Z" fill="#4DA3FF" stroke="#1E1B2E" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="20" cy="32" r="13" fill="#4DA3FF" stroke="#1E1B2E" stroke-width="3.5"/>
    <circle cx="17" cy="32" r="4.5" fill="#FFC93C" stroke="#1E1B2E" stroke-width="3"/>
  </g>
</svg>
