<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Wren logo">
  <title>Wren logo</title><desc>The Wren logo: a sky-blue key with a round bow and two teeth, leaning up and to the right.</desc>
  <!-- Wren: a key in Busy's sticker style (thick ink outline, offset shadow); the key to a home kept in good order -->
